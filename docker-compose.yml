services:
  budget:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      # Daily backups go to /data/backups. To keep them on another disk, uncomment both lines below.
      # BACKUP_DIR: /backups
    volumes:
      - ./data:/data
      # - /path/to/other/disk/budget-backups:/backups
